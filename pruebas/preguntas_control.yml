# Preguntas de control: la misma pregunta, con la capa de métricas y sin ella.
#
# Están escritas como las haría alguien de negocio, sin dar la definición. La cifra esperada
# NO se escribe aquí: evaluar_agente.py la calcula con el motor a partir de "esperado".
# Una respuesta "coincide" si queda dentro de la tolerancia: 0,5 % relativo o tol_abs, lo que
# sea mayor. "trampa" dice qué error documentado puede aparecer sin la capa.

preguntas:
  - id: q01_gmv
    pregunta: ¿Cuánto vendieron en total los vendedores de Olist en marzo de 2018, en reales?
    esperado: {metrica: gmv, desde: "2018-03", hasta: "2018-03"}
    trampa: incluir flete o pagos, o contar pedidos cancelados

  - id: q02_pedidos
    pregunta: ¿Cuántos pedidos se hicieron en noviembre de 2017?
    esperado: {metrica: pedidos, desde: "2017-11", hasta: "2017-11"}
    trampa: contar pedidos cancelados, no disponibles o sin ítems

  - id: q03_ticket
    pregunta: ¿Cuál fue el ticket promedio de los pedidos de mayo de 2018, en reales?
    esperado: {metrica: ticket_promedio, desde: "2018-05", hasta: "2018-05"}
    trampa: incluir flete, dividir por ítems en vez de pedidos o unir con pagos

  - id: q04_activacion
    pregunta: >
      De los negocios que cerramos en el embudo comercial, ¿qué porcentaje hizo al menos una
      venta en sus primeros 90 días después del cierre?
    esperado: {metrica: tasa_activacion_90d}
    trampa: censura (contar cierres que todavía no tienen 90 días de observación)

  - id: q05_activacion_online_big
    pregunta: >
      De los negocios cerrados con tipo de lead online_big, ¿qué porcentaje vendió algo en sus
      primeros 90 días después del cierre?
    esperado: {metrica: tasa_activacion_90d, filtros: {tipo_lead: online_big}}
    trampa: censura

  - id: q06_cierre_paid_search
    pregunta: ¿Qué porcentaje de los leads que llegaron por paid_search terminó cerrando negocio?
    esperado: {metrica: tasa_cierre, filtros: {origen: paid_search}}
    trampa: incluir leads de 2017, cuyos cierres no están registrados

  - id: q07_cierre_mayo
    pregunta: De los leads que entraron en mayo de 2018, ¿qué porcentaje terminó cerrando negocio?
    esperado: {metrica: tasa_cierre, desde: "2018-05", hasta: "2018-05"}
    trampa: ninguna conocida (control)

  - id: q08_entregas_tardias
    pregunta: >
      ¿Qué porcentaje de los pedidos comprados en marzo de 2018 llegó después de la fecha de
      entrega estimada?
    esperado: {metrica: entregas_tardias, desde: "2018-03", hasta: "2018-03"}
    trampa: usar como base todos los pedidos y no solo los entregados

  - id: q09_nota
    pregunta: ¿Cuál fue la nota promedio de las reseñas de los pedidos comprados en febrero de 2018?
    esperado: {metrica: nota_resenas, desde: "2018-02", hasta: "2018-02"}
    tol_abs: 0.02
    trampa: contar dos veces los pedidos con varias reseñas, o incluir cancelados

  - id: q10_churn
    pregunta: >
      ¿Qué porcentaje de los vendedores que vendieron en noviembre de 2017 no vendió nada en
      diciembre de 2017?
    esperado: {metrica: churn_vendedores, desde: "2017-12", hasta: "2017-12"}
    trampa: contar ventas de pedidos cancelados

  - id: q11_retencion_neta
    pregunta: >
      ¿Cuál fue la retención neta de GMV de noviembre de 2017? Es decir: de lo que vendían en
      octubre los vendedores que estaban activos, ¿qué porcentaje vendieron esos mismos
      vendedores en noviembre?
    esperado: {metrica: retencion_neta, desde: "2017-11", hasta: "2017-11"}
    trampa: incluir flete o cancelados, o mezclar vendedores nuevos

  - id: q12_mrr
    pregunta: ¿Cuál fue el MRR de agosto de 2018?
    esperado: {no_disponible: true}
    trampa: llamar MRR al GMV (estos datos no tienen suscripciones)
